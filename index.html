    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-4X11DW5WNW"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      /*
        send_page_view is off on purpose — do NOT turn it back on.

        Two reasons. This is a single-page app, so the automatic hit only ever
        fires on the first load and every in-app route change would go unrecorded.
        And the automatic hit reports the full URL: /intake carries a one-time
        MDIntegrations voucher token in its query string, and that token would be
        handed straight to Google. src/lib/analytics.js sends page views itself,
        pathname only, on every route change.
      */
      gtag('config', 'G-4X11DW5WNW', { send_page_view: false });
    </script>
